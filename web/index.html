<header class="bar">
  <div class="bar-in">
    <a class="brand" href="/" aria-label="Jeevan Dhara home">
      <svg class="icon" aria-hidden="true"><use href="#i-drop"/></svg><span>Jeevan Dhara</span>
    </a>
    <nav class="bar-nav" aria-label="More">
      <button id="newChat" class="bar-btn" type="button" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span data-t="new">New</span>
      </button>
      <a class="bar-btn" href="app.html#donate"><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg><span data-t="donate">Donate</span></a>
      <a class="bar-btn" href="app.html#requests" aria-label="My requests" data-t-aria="requests"><svg class="icon" aria-hidden="true"><use href="#i-history"/></svg></a>
    </nav>
  </div>
</header>

<main id="main" class="convo" aria-label="Conversation">
  <section id="intro" class="intro">
    <svg class="intro-drop" aria-hidden="true"><use href="#i-drop"/></svg>
    <h1>Need blood? Just tell me.</h1>
    <p class="intro-hi" lang="hi">बोलिए कौन सा खून चाहिए और कहाँ। किसी भी भाषा में।</p>
    <p class="intro-eg">“O negative, 2 units, near Jayanagar, Bengaluru”</p>
  </section>
  <ol id="thread" class="thread" aria-live="polite" aria-relevant="additions"></ol>
</main>

<div class="dock">
  <form id="typeForm" class="type-form" hidden>
    <label class="vh" for="typeIn" data-t="type_label">Type your request</label>
    <input id="typeIn" type="text" maxlength="400" autocomplete="off" enterkeyhint="send" placeholder="O+ 2 units near Andheri, Mumbai">
    <button class="type-send" type="submit" aria-label="Send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button>
  </form>
  <div class="dock-row">
    <button id="typeBtn" class="side-btn" type="button" aria-label="Type instead" data-t-aria="type_instead" aria-pressed="false">
      <svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg>
    </button>
    <button id="talk" class="talk" type="button" data-state="idle" aria-label="Tap to talk">
      <span class="talk-ring" aria-hidden="true"></span>
      <svg class="icon talk-icon" aria-hidden="true"><use href="#i-mic"/></svg>
    </button>
    <span class="side-btn side-spacer" aria-hidden="true"></span>
  </div>
  <p id="status" class="status" role="status">Tap and speak · <span lang="hi">दबाइए और बोलिए</span></p>
  <p class="foot">
    <span data-t="demo">Demo data</span> ·
    <a href="tel:108"><span data-t="emergency">Emergency</span> <b>108</b></a> ·
    <a href="tel:104"><span data-t="helpline">Helpline</span> <b>104</b></a>
  </p>
</div>

<audio id="player" preload="none"></audio>

<template id="tpl-bank">
  <li class="bank">
    <div class="bank-top"><span class="rank num"></span><h3 class="bank-name"></h3><span class="bank-km num"></span></div>
    <div class="bank-stock"><span class="grp"></span><span class="units"></span><span class="compat" hidden></span></div>
    <p class="bank-when"><svg class="icon i-sm" aria-hidden="true"><use href="#i-schedule"/></svg><span></span></p>
    <p class="bank-meta"></p>
    <div class="bank-acts">
      <a class="btn btn-red act-call"><svg class="icon" aria-hidden="true"><use href="#i-call"/></svg><span></span></a>
      <a class="btn btn-line act-dir" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-directions"/></svg><span></span></a>
    </div>
  </li>
</template>
</body>
</html>
